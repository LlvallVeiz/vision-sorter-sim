[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-sorter-sim"
version = "1.0.0"
description = "End-to-end machine-vision conveyor sorting simulator (Otsu, connected components, Hu moments, rule-based classification)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "Pillow>=10"]

[project.scripts]
vision-sorter-sim = "vision_sorter_sim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
